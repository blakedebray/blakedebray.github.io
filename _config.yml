# Site settings
title: Blake DeBray
description: Program Manager, Coach, Human - Professional coaching and consulting services to help individuals, teams, and organizations thrive.
baseurl: ""
url: ""
logo: /assets/images/logo.svg

# SEO settings
author: Blake DeBray
social:
  name: Blake DeBray
  links:
    - https://github.com/blakedebray
    - https://www.linkedin.com/in/blakedebray/

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jemoji

# Performance optimizations
sass:
  style: compressed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .DS_Store
  - README.md
  - .gitignore

# Collections
collections:
  workshops:
    output: true
  books:
    output: true
  services:
    output: true

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "services"
    values:
      layout: "default"
