- title: "Reframing Conflict: The Superpower of Nonviolent Communication"
  description: "Human interaction is complex and for many, the way we are taught to communicate with each other stems from systems that encourage confrontation, getting our way, or winning over others. This form of communication is prevalent in modern workplaces as well. But what if there were ways to communicate with compassion as the core tenant of our interactions? What if we could make our humanity, compassion, and empathy a central skill in how we show up with others? In this presentation, we will learn and practice Nonviolent Communication to shift how we approach situations of conflict to one of compassion, empathy, and a deeper understanding of others (and ourselves). These techniques can lead to better outcomes at home, in our communities, and with our coworkers."
  theme: "Coaching, Leadership Development, Conflict, Communication"
  link: https://www.meetup.com/agile-kc/events/304365518/?eventOrigin=group_events_list
  order: 1

- title: "Coaching as Leaders: Presence"
  description: "As humans, it is important to recognize the power and gift of being present with another and how it can impact our relationships, ability to lead, and develop trust and safety with others. As leaders, being present is essential. This presentation and practice explores how presence is a core leadership skill and recognize challenges that can get in the way with giving such a gift to others (and receive it in return)."
  theme: "Coaching, Leadership Development, Communication"
  link: ""
  order: 2

- title: "Organizational Agility is a Journey"
  description: "Organizational agility is a journey, not a destination. Yet many of us have been part of organizations that have \"completed\" a transformation or installed a framework and stopped. Where many of us get stuck is losing sight of the \"why\"; and instead do the rituals in hope for the big result. In this discussion, Blake DeBray will share the story of Ad Astra's exploration with agility, from their start in accidentally installing fake Agile to where they are today. We hope that sharing this story will help others and reconnect to why we are on this journey in the first place."
  theme: "Organizational Development, Lean, Agile, Metrics"
  link: https://www.meetup.com/agile-kc/events/304365518/?eventOrigin=group_events_list
  order: 3

- title: "Test-Driven Value Propositions: Using Lean Startup Practices to Define Better Customer Value"
  description: "There are a lot of tools and practices that help Agile teams deliver value, but how do we identify the right value in the first place? Product Owners have the difficult job of representing the customers and making assumptions of what they want. These assumptions end up in a backlog and incremental delivery helps us test them. But what if we could test our assumptions of what customers want even faster and cheaper, especially when we are not even sure if we should build it? In this talk, we will look at how we can use an experiment-driven approach to quickly and cheaply identify and test our assumptions on what is most important to customers."
  theme: "Program Management, Lean Startup, Agile"
  link: https://2015.leanagilekc.com/sessions/test-driven-value-propositions/
  order: 4