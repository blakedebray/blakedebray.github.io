<div class="service-module">
    <div class="service-title-section">
        <div class="service-title-content">
            <h3 class="service-title">{{ include.service.title }}</h3>
        </div>
    </div>
    <div class="service-content">
        <div class="service-description">{{ include.service.description | markdownify }}</div>
        <a href="{{ include.service.url }}" class="service-cta" aria-label="Learn more about {{ include.service.title }}">Learn more</a>
    </div>
</div>
